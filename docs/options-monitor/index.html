<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Options Monitor — KFOO Intelligence</title><style>body{margin:0;font-family:system-ui;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:auto;padding:24px}.sub,.muted{color:#9aa6c3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#121a2f;border:1px solid #26304a;border-radius:14px;padding:16px}label{display:block;color:#9aa6c3;font-size:12px;margin:10px 0 4px}input,select{width:100%;box-sizing:border-box;background:#0c1326;color:#fff;border:1px solid #303b59;border-radius:8px;padding:10px}button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:9px;background:#4f7cff;color:white;font-weight:700}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#25314f;font-size:12px}.ok{color:#7ee2a8}.bad{color:#ff8b8b}table{width:100%;border-collapse:collapse;margin-top:10px}td{padding:8px;border-bottom:1px solid #26304a}</style></head><body><main><h1>Options Monitor</h1><div class="sub">KFOO evidence → underlying direction → contract mechanics → target R:R. Read-only.</div><div class="grid" style="margin-top:18px"><section class="card"><h3>Underlying</h3><label>Symbol</label><input id="symbol" value="NVDA"><label>Direction</label><select id="direction"><option>BULLISH</option><option>BEARISH</option></select><label>KFOO gates passed</label><input id="gates" type="number" min="0" max="5" value="5"><label>Target underlying</label><input id="target" type="number" step="0.01" value="155"></section><section class="card"><h3>Contract</h3><label>Type</label><select id="type"><option>CALL</option><option>PUT</option></select><label>Strike</label><input id="strike" type="number" step="0.01" value="150"><label>DTE</label><input id="dte" type="number" step="1" value="30"><label>Delta</label><input id="delta" type="number" step="0.01" value="0.55"></section><section class="card"><h3>Market</h3><label>Bid</label><input id="bid" type="number" step="0.01" value="4.80"><label>Ask</label><input id="ask" type="number" step="0.01" value="5.20"><label>Open Interest</label><input id="oi" type="number" value="500"><label>Volume</label><input id="volume" type="number" value="100"></section></div><div class="card" style="margin-top:12px"><button onclick="analyze()">Analyze contract</button><div id="output">Enter a contract and analyze.</div><table id="details"></table></div></main><script>function analyze(){const n=id=>Number(document.getElementById(id).value),s=document.getElementById("symbol").value.trim().toUpperCase(),dir=document.getElementById("direction").value,type=document.getElementById("type").value;const strike=n("strike"),target=n("target"),bid=n("bid"),ask=n("ask"),delta=n("delta"),dte=n("dte"),oi=n("oi"),gates=n("gates");const mid=(bid+ask)/2,spread=mid>0?(ask-bid)/mid:Infinity,expected=dir==="BULLISH"?"CALL":"PUT",reasons=[];if(gates<5)reasons.push("KFOO gates incomplete");if(type!==expected)reasons.push("option type mismatch");if(dte<7||dte>90)reasons.push("DTE outside 7–90 policy");if(Math.abs(delta)<.30||Math.abs(delta)>.70)reasons.push("delta outside 0.30–0.70");if(mid<=0||bid<=0||ask<bid)reasons.push("invalid quote");if(spread>.10)reasons.push("bid/ask spread above 10%");if(oi<1)reasons.push("open interest below minimum");const intrinsic=type==="CALL"?Math.max(target-strike,0):Math.max(strike-target,0),reward=intrinsic-mid,loss=mid,rr=reward>0&&loss>0?reward/loss:null;if(rr===null)reasons.push("target reward is non-positive");else if(rr<1)reasons.push("target R:R below 1.0");const ok=!reasons.length;document.getElementById("output").innerHTML="<span class="badge "+(ok?"ok":"bad")+"">"+(ok?"CONFIRMED":"REJECTED")+"</span>";document.getElementById("details").innerHTML=[["Underlying",s+" / "+dir],["KFOO gates",gates+"/5"],["Contract",type+" "+strike+" / "+dte+" DTE"],["Mid",mid.toFixed(2)],["Spread",(spread*100).toFixed(2)+"%"],["Target reward",reward.toFixed(2)],["Max loss at entry",loss.toFixed(2)],["Target R:R",rr===null?"—":rr.toFixed(2)+"R"],["Reasons",reasons.length?reasons.join(", "):"All configured gates passed"]].map(r=>"<tr><td class="muted">"+r[0]+"</td><td>"+r[1]+"</td></tr>").join("")}</script></body></html>
